[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "express",
    "mongoose",
    "mongodb",
    "bcryptjs",
    "express-session",
    "connect-mongo",
    "multer",
    "serverless-http"
  ]

[functions.api]
  timeout = 26
  included_files = [
    "server.js",
    "database.js",
    "env.js",
    "models/**",
    "services/**",
    "curated-pins.js",
    "pinterest-pins.js",
    "data/**"
  ]

# Keep original /api/... path for the Express app
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "20"
