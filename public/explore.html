<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiMuse | Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">ArchiMuse</a>
      <nav class="main-nav" data-nav>
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="explore.html" class="active" data-i18n="nav.shop">Shop</a>
        <a href="projects.html" data-i18n="nav.gallery">Gallery</a>
        <a href="saved.html" data-i18n="nav.saved">Saved</a>
        <a href="login.html" data-i18n="nav.login">Login</a>
      </nav>
      <div class="topbar-right">
        <div class="lang-switch" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="sq">SQ</button>
        </div>
        <a href="profile.html" id="userBadge" class="user-badge">Guest</a>
      </div>
    </header>

    <main class="page-wrap">
      <h1 data-i18n="shop.title">Design shop</h1>
      <p class="page-subtitle" data-i18n="shop.sub">Browse, like, save, share and buy studio designs.</p>

      <section class="search-panel reveal">
        <form id="searchForm" class="search-form">
          <input id="searchInput" name="search" type="text" data-i18n-placeholder="shop.search" placeholder="Search by title or bio…" />
          <select id="categoryFilter" name="category">
            <option value="all">All</option>
            <option value="modern">Modern</option>
            <option value="minimal">Minimal</option>
            <option value="brutalist">Brutalist</option>
            <option value="interior">Interior</option>
            <option value="landscape">Landscape</option>
            <option value="futuristic">Futuristic</option>
            <option value="furniture">Furniture</option>
          </select>
          <select id="sortFilter" name="sort">
            <option value="latest">Latest</option>
            <option value="trending">Trending</option>
            <option value="most-liked">Most liked</option>
            <option value="most-saved">Most saved</option>
            <option value="most-viewed">Most viewed</option>
          </select>
          <button class="btn" type="submit" data-i18n="shop.filter">Filter</button>
        </form>
      </section>

      <section id="pinsGrid" class="pins-grid shop-grid">
        <p class="empty-state" data-i18n="home.loading">Loading designs…</p>
      </section>
      <section id="feedSkeleton" class="pins-grid shop-grid skeleton-grid hidden"></section>
    </main>

    <div id="pinDetailModal" class="modal hidden">
      <div class="modal-card detail-modal">
        <button id="closeDetailBtn" class="close-btn" type="button" aria-label="Close">×</button>
        <div id="pinDetailContent" class="detail-content"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
