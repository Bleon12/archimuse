<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiMuse | Upload</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">ArchiMuse</a>
      <nav class="main-nav" data-nav>
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="projects.html" data-i18n="nav.projects">Projects</a>
        <a href="explore.html" data-i18n="nav.shop">Shop</a>
      </nav>
      <div class="topbar-right">
        <div class="lang-switch" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="sq">SQ</button>
        </div>
        <a href="profile.html" id="userBadge" class="user-badge">Guest</a>
      </div>
    </header>

    <main class="page-wrap">
      <h1 data-i18n="upload.title">Upload design for sale</h1>
      <p class="page-subtitle" data-i18n="upload.sub">Seller account only. Set a price and publish to the shop.</p>
      <p id="sellerGateMessage" class="message seller-gate hidden"></p>

      <section class="upload-box reveal" data-upload-panel="upload">
        <form id="uploadForm">
          <label for="pinTitle" data-i18n="upload.designTitle">Design title</label>
          <input id="pinTitle" name="title" type="text" required />

          <label for="pinBio" data-i18n="upload.bio">Description</label>
          <textarea id="pinBio" name="bio" rows="4"></textarea>

          <label for="pinCategory" data-i18n="upload.category">Category</label>
          <select id="pinCategory" name="category" required>
            <option value="modern">Modern</option>
            <option value="minimal">Minimal</option>
            <option value="brutalist">Brutalist</option>
            <option value="interior">Interior</option>
            <option value="landscape">Landscape</option>
            <option value="futuristic">Futuristic</option>
            <option value="furniture">Furniture</option>
          </select>

          <div class="price-row">
            <div>
              <label for="pinPrice" data-i18n="upload.price">Price</label>
              <input id="pinPrice" name="price" type="number" min="0" step="1" value="120" required />
            </div>
            <div>
              <label for="pinCurrency" data-i18n="upload.currency">Currency</label>
              <select id="pinCurrency" name="currency">
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="ALL">ALL</option>
              </select>
            </div>
          </div>

          <label class="drawer-toggle">
            <input id="pinForSale" name="forSale" type="checkbox" checked />
            <span data-i18n="upload.forSale">For sale</span>
          </label>

          <label data-i18n="upload.image">Image</label>
          <div id="uploadDropzone" class="upload-dropzone">
            <p data-i18n="upload.drop">Drop image here or click to choose</p>
            <input id="pinImage" name="image" type="file" accept="image/*" required />
          </div>
          <div id="uploadPreview" class="upload-preview hidden"></div>

          <button type="submit" class="btn" data-i18n="upload.submit">Upload design</button>
          <p id="uploadMessage" class="message"></p>
        </form>
      </section>

      <h2 data-i18n="profile.my">My designs</h2>
      <section id="myPinsGrid" class="pins-grid shop-grid"></section>
    </main>

    <div id="editModal" class="modal hidden">
      <div class="modal-card">
        <h3 data-i18n="upload.edit">Edit design</h3>
        <form id="editPinForm">
          <input type="hidden" id="editPinId" />
          <label for="editTitle" data-i18n="upload.designTitle">Design title</label>
          <input id="editTitle" type="text" required />
          <label for="editBio" data-i18n="upload.bio">Description</label>
          <textarea id="editBio" rows="3"></textarea>
          <label for="editCategory" data-i18n="upload.category">Category</label>
          <select id="editCategory" required>
            <option value="modern">Modern</option>
            <option value="minimal">Minimal</option>
            <option value="brutalist">Brutalist</option>
            <option value="interior">Interior</option>
            <option value="landscape">Landscape</option>
            <option value="futuristic">Futuristic</option>
            <option value="furniture">Furniture</option>
          </select>
          <label for="editPrice" data-i18n="upload.price">Price</label>
          <input id="editPrice" type="number" min="0" step="1" />
          <div class="modal-actions">
            <button type="button" id="cancelEditBtn" class="small-btn" data-i18n="upload.cancel">Cancel</button>
            <button type="submit" class="btn" data-i18n="profile.save">Save</button>
          </div>
        </form>
      </div>
    </div>

    <div id="pinDetailModal" class="modal hidden">
      <div class="modal-card detail-modal">
        <button id="closeDetailBtn" class="close-btn" type="button" aria-label="Close">×</button>
        <div id="pinDetailContent" class="detail-content"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
