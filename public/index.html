<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiMuse | Design Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">ArchiMuse</a>
      <nav class="main-nav" data-nav>
        <a href="index.html" class="active" data-i18n="nav.home">Home</a>
        <a href="explore.html" data-i18n="nav.shop">Shop</a>
        <a href="projects.html" data-i18n="nav.gallery">Gallery</a>
        <a href="saved.html" data-i18n="nav.saved">Saved</a>
        <a href="login.html" data-i18n="nav.login">Login</a>
      </nav>
      <div class="topbar-right">
        <div class="lang-switch" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="sq">SQ</button>
        </div>
        <a href="profile.html" id="userBadge" class="user-badge">Guest</a>
      </div>
    </header>

    <main class="hero-page">
      <section class="hero hero--shop">
        <div class="hero-media" aria-hidden="true">
          <img src="designs/olive-lounge.webp" alt="" />
        </div>
        <div class="hero-content reveal">
          <p class="hero-eyebrow" data-i18n="home.eyebrow">Design studio & sales</p>
          <h1>ArchiMuse</h1>
          <p data-i18n="home.lead">
            Browse our designs, like, save, share and buy. Apply for online or cash payment — requests start as pending.
          </p>
          <div class="hero-actions">
            <a class="btn" href="explore.html" data-i18n="home.ctaShop">View shop</a>
            <a class="btn btn-outline" href="projects.html" data-i18n="home.ctaGallery">Gallery</a>
          </div>
        </div>
      </section>

      <section class="section-header">
        <h2 data-i18n="home.saleTitle">Designs for sale</h2>
        <p data-i18n="home.saleSub">Open any card to like, comment, share or buy.</p>
      </section>

      <section id="homeDecorGrid" class="pins-grid shop-grid">
        <p class="empty-state" data-i18n="home.loading">Loading designs…</p>
      </section>
      <section id="feedSkeleton" class="pins-grid shop-grid skeleton-grid hidden"></section>
    </main>

    <div id="pinDetailModal" class="modal hidden">
      <div class="modal-card detail-modal">
        <button id="closeDetailBtn" class="close-btn" type="button" aria-label="Close">×</button>
        <div id="pinDetailContent" class="detail-content"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
