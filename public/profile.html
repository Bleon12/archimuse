<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiMuse | Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">ArchiMuse</a>
      <nav class="main-nav" data-nav>
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="projects.html" data-i18n="nav.projects">Projects</a>
        <a href="explore.html" data-i18n="nav.shop">Shop</a>
      </nav>
      <div class="topbar-right">
        <div class="lang-switch" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="sq">SQ</button>
        </div>
        <a href="profile.html" id="userBadge" class="user-badge active">Guest</a>
      </div>
    </header>

    <main class="profile-layout page-wrap">
      <aside class="profile-sidebar reveal">
        <div class="profile-sidebar-head">
          <span id="profileAvatar" class="profile-avatar">U</span>
          <div>
            <h1 data-i18n="profile.title">My profile</h1>
            <p id="profileStats" class="profile-stats">…</p>
          </div>
        </div>
        <nav class="profile-side-nav">
          <button class="profile-side-btn active" data-profile-tab="settings" data-i18n="profile.settings">Settings</button>
          <button class="profile-side-btn" data-profile-tab="orders" data-i18n="profile.orders">Orders</button>
          <button class="profile-side-btn" data-profile-tab="my" data-i18n="profile.my">My designs</button>
          <button class="profile-side-btn" data-profile-tab="saved" data-i18n="nav.saved">Saved</button>
          <button class="profile-side-btn" data-profile-tab="liked" data-i18n="profile.liked">Liked</button>
          <button class="profile-side-btn seller-only hidden" data-profile-tab="seller-orders" data-i18n="profile.sellerOrders">Customer requests</button>
          <a class="profile-side-btn seller-only hidden" href="admin.html">Admin panel</a>
          <a class="profile-side-btn seller-only hidden" href="upload.html" data-i18n="profile.upload">Upload design</a>
          <button class="profile-side-btn" type="button" id="profileLogoutBtn" data-i18n="profile.logout">Logout</button>
        </nav>
      </aside>

      <div class="profile-main">
        <section id="profileSettingsPanel" class="profile-bio-box reveal">
          <h2 data-i18n="profile.settings">Settings</h2>
          <form id="profileBioForm">
            <label for="profileName" data-i18n="login.name">Name</label>
            <input id="profileName" type="text" required />
            <label for="profileBio">Bio</label>
            <textarea id="profileBio" rows="4" maxlength="280"></textarea>
            <button type="submit" class="btn" data-i18n="profile.save">Save profile</button>
            <p id="profileMessage" class="message"></p>
          </form>
        </section>

        <section id="profileOrdersPanel" class="orders-panel hidden">
          <h2 data-i18n="profile.orders">Orders</h2>
          <p class="page-subtitle" data-i18n="profile.ordersSub">Status: pending, confirmed, completed or cancelled.</p>
          <div id="profileOrdersList" class="orders-list">
            <p class="empty-state">…</p>
          </div>
        </section>

        <section id="sellerOrdersPanel" class="orders-panel hidden">
          <h2 data-i18n="profile.sellerOrders">Customer requests</h2>
          <div id="sellerOrdersList" class="orders-list"><p class="empty-state">…</p></div>
        </section>

        <section id="profileMyGrid" class="pins-grid shop-grid hidden"></section>
        <section id="profileSavedGrid" class="pins-grid shop-grid hidden"></section>
        <section id="profileLikedGrid" class="pins-grid shop-grid hidden"></section>
      </div>
    </main>

    <div id="pinDetailModal" class="modal hidden">
      <div class="modal-card detail-modal">
        <button id="closeDetailBtn" class="close-btn" type="button" aria-label="Close">×</button>
        <div id="pinDetailContent" class="detail-content"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
