<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiMuse | Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="projects-page">
    <header class="topbar">
      <a class="brand" href="index.html">ArchiMuse</a>
      <nav class="main-nav" data-nav>
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="projects.html" class="active" data-i18n="nav.projects">Projects</a>
        <a href="explore.html" data-i18n="nav.shop">Shop</a>
      </nav>
      <div class="topbar-right">
        <a href="cv.html" class="cv-icon" aria-label="CV" title="CV">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.1"/><path d="M5.2 19.2c1.5-3.2 3.9-5 6.8-5s5.3 1.8 6.8 5"/></svg>
        </a>
        <div class="mode-switch" aria-label="Theme">
          <button type="button" class="mode-btn active" data-theme="cream" data-i18n="theme.cream">Cream</button>
          <button type="button" class="mode-btn" data-theme="dark" data-i18n="theme.dark">Dark</button>
        </div>
        <div class="lang-switch" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="sq">SQ</button>
        </div>
      </div>
    </header>

    <main class="look-main">
      <section class="look-intro">
        <p class="hero-eyebrow" data-i18n="gallery.eyebrow">Studio work</p>
        <h1 data-i18n="gallery.title">Find a space</h1>
        <p data-i18n="gallery.lead">Pick a type. The photos open. If one feels right, start a brief.</p>
      </section>

      <p class="look-doors-label" data-i18n="gallery.pick">What are you looking for?</p>
      <section class="look-doors" id="lookDoors">
        <button type="button" class="look-door is-on" data-room="all">
          <img src="designs/courtyard-villa.jpg" alt="" />
          <span data-i18n="gallery.all">All</span>
        </button>
        <button type="button" class="look-door" data-room="house">
          <img src="designs/atrium-house.jpg" alt="" />
          <span data-i18n="gallery.house">House</span>
        </button>
        <button type="button" class="look-door" data-room="rooms">
          <img src="designs/soft-living.jpg" alt="" />
          <span data-i18n="gallery.rooms">Rooms</span>
        </button>
        <button type="button" class="look-door" data-room="kitchen">
          <img src="designs/oak-kitchen.jpg" alt="" />
          <span data-i18n="gallery.kitchen">Kitchen</span>
        </button>
        <button type="button" class="look-door" data-room="furniture">
          <img src="designs/olive-lounge.webp" alt="" />
          <span data-i18n="gallery.furniture">Furniture</span>
        </button>
      </section>

      <section class="look-hook">
        <div>
          <p class="look-hook-kicker" data-i18n="gallery.hookKicker">For clients</p>
          <h2 data-i18n="gallery.hook">Like a room? We prepare the final from your brief.</h2>
        </div>
        <div class="look-hook-actions">
          <button type="button" class="btn" id="lookSurprise" data-i18n="gallery.surprise">Surprise me</button>
          <a class="btn btn-outline" href="index.html#projectBrief" data-i18n="gallery.brief">Start a brief</a>
        </div>
      </section>

      <p class="look-count"><span id="projectsTotal">22</span> <span data-i18n="gallery.designs">designs</span></p>
      <section id="projectsGrid" class="look-wall">
        <p class="empty-state" data-i18n="home.loading">Loading designs…</p>
      </section>
    </main>

    <div id="pinDetailModal" class="modal hidden">
      <div class="modal-card detail-modal">
        <button id="closeDetailBtn" class="close-btn" type="button" aria-label="Close">×</button>
        <div id="pinDetailContent" class="detail-content"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
