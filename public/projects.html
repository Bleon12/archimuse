<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiMuse | Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="projects-page">
    <header class="topbar">
      <a class="brand" href="index.html">ArchiMuse</a>
      <nav class="main-nav" data-nav>
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="projects.html" class="active" data-i18n="nav.projects">Projects</a>
        <a href="explore.html" data-i18n="nav.shop">Shop</a>
      </nav>
      <div class="topbar-right">
        <a href="cv.html" class="cv-icon" aria-label="CV" title="CV">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.1"/><path d="M5.2 19.2c1.5-3.2 3.9-5 6.8-5s5.3 1.8 6.8 5"/></svg>
        </a>
        <div class="mode-switch" aria-label="Theme">
          <button type="button" class="mode-btn active" data-theme="cream" data-i18n="theme.cream">Cream</button>
          <button type="button" class="mode-btn" data-theme="dark" data-i18n="theme.dark">Dark</button>
        </div>
        <div class="lang-switch" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="sq">SQ</button>
        </div>
      </div>
    </header>

    <main class="projects-main">
      <section class="projects-hero reveal">
        <div class="projects-hero-glow"></div>
        <p class="hero-eyebrow" data-i18n="gallery.eyebrow">Studio work</p>
        <h1 data-i18n="gallery.title">Projects</h1>
        <p class="projects-hero-text" data-i18n="gallery.lead">
          Interiors, furniture and architecture — click a card to open it.
        </p>
        <div class="projects-stats">
          <div class="stat-pill"><span id="projectsTotal">—</span> <span data-i18n="gallery.designs">designs</span></div>
        </div>
      </section>

      <section class="projects-toolbar reveal">
        <div class="projects-filters">
          <select id="projectCategoryFilter">
            <option value="all">All</option>
            <option value="modern">Modern</option>
            <option value="minimal">Minimal</option>
            <option value="brutalist">Brutalist</option>
            <option value="interior">Interior</option>
            <option value="landscape">Landscape</option>
            <option value="futuristic">Futuristic</option>
            <option value="furniture">Furniture</option>
            <option value="architecture">Architecture</option>
          </select>
        </div>
      </section>

      <section id="featuredProjects" class="featured-row"></section>
      <section id="projectsGrid" class="projects-grid">
        <p class="empty-state" data-i18n="home.loading">Loading designs…</p>
      </section>
      <p id="projectsEndHint" class="empty-state hidden" data-i18n="gallery.end">End of gallery</p>
      <section id="feedSkeleton" class="pins-grid shop-grid skeleton-grid hidden"></section>
    </main>

    <div id="pinDetailModal" class="modal hidden">
      <div class="modal-card detail-modal">
        <button id="closeDetailBtn" class="close-btn" type="button" aria-label="Close">×</button>
        <div id="pinDetailContent" class="detail-content"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
