<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiMuse | Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-page">
    <header class="topbar">
      <a class="brand" href="index.html">ArchiMuse</a>
      <nav class="main-nav">
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="explore.html" data-i18n="nav.shop">Shop</a>
        <a href="admin.html" class="active">Admin</a>
        <a href="profile.html" data-i18n="nav.profile">Profile</a>
      </nav>
      <div class="topbar-right">
        <div class="lang-switch">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="sq">SQ</button>
        </div>
        <button type="button" id="accountMenuBtn" class="account-menu-btn" aria-label="Account menu">☰</button>
        <a href="profile.html" id="userBadge" class="user-badge">Guest</a>
      </div>
    </header>

    <main class="page-wrap admin-wrap">
      <h1 data-i18n="admin.title">Admin panel</h1>
      <p class="page-subtitle" data-i18n="admin.sub">Add designs, manage catalog, and review buy requests from clients.</p>
      <p id="adminGate" class="message seller-gate hidden"></p>

      <div class="admin-tabs">
        <button type="button" class="tab-btn active" data-admin-tab="orders" data-i18n="admin.tabOrders">Buy requests</button>
        <button type="button" class="tab-btn" data-admin-tab="designs" data-i18n="admin.tabDesigns">All designs</button>
        <button type="button" class="tab-btn" data-admin-tab="upload" data-i18n="admin.tabUpload">Add design</button>
      </div>

      <section id="adminOrdersPanel" class="admin-panel">
        <div class="admin-toolbar">
          <select id="adminOrderFilter">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <button type="button" class="small-btn" id="refreshAdminOrders" data-i18n="admin.refresh">Refresh</button>
        </div>
        <div id="adminOrdersList" class="orders-list">
          <p class="empty-state">…</p>
        </div>
      </section>

      <section id="adminDesignsPanel" class="admin-panel hidden">
        <div id="adminDesignsList" class="admin-designs-table-wrap">
          <p class="empty-state">…</p>
        </div>
      </section>

      <section id="adminUploadPanel" class="admin-panel hidden">
        <form id="uploadForm" class="upload-box">
          <label for="pinTitle" data-i18n="upload.designTitle">Design title</label>
          <input id="pinTitle" name="title" type="text" required />
          <label for="pinBio" data-i18n="upload.bio">Description</label>
          <textarea id="pinBio" name="bio" rows="3"></textarea>
          <label for="pinCategory" data-i18n="upload.category">Category</label>
          <select id="pinCategory" name="category" required>
            <option value="modern">Modern</option>
            <option value="minimal">Minimal</option>
            <option value="brutalist">Brutalist</option>
            <option value="interior">Interior</option>
            <option value="landscape">Landscape</option>
            <option value="futuristic">Futuristic</option>
          </select>
          <div class="price-row">
            <div>
              <label for="pinPrice" data-i18n="upload.price">Price</label>
              <input id="pinPrice" name="price" type="number" min="0" value="120" required />
            </div>
            <div>
              <label for="pinCurrency" data-i18n="upload.currency">Currency</label>
              <select id="pinCurrency" name="currency">
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="ALL">ALL</option>
              </select>
            </div>
          </div>
          <label class="drawer-toggle">
            <input id="pinForSale" type="checkbox" checked />
            <span data-i18n="upload.forSale">For sale</span>
          </label>
          <label data-i18n="upload.image">Image</label>
          <div id="uploadDropzone" class="upload-dropzone">
            <p data-i18n="upload.drop">Drop image here or click to choose</p>
            <input id="pinImage" name="image" type="file" accept="image/*" required />
          </div>
          <div id="uploadPreview" class="upload-preview hidden"></div>
          <button type="submit" class="btn" data-i18n="upload.submit">Upload design</button>
          <p id="uploadMessage" class="message"></p>
        </form>
      </section>
    </main>

    <div id="pinDetailModal" class="modal hidden">
      <div class="modal-card detail-modal ig-modal">
        <button id="closeDetailBtn" class="close-btn" type="button" aria-label="Close">×</button>
        <div id="pinDetailContent" class="detail-content"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
