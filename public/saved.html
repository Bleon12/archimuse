<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiMuse | Saved</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">ArchiMuse</a>
      <nav class="main-nav" data-nav>
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="explore.html" data-i18n="nav.shop">Shop</a>
        <a href="projects.html" data-i18n="nav.gallery">Gallery</a>
        <a href="saved.html" class="active" data-i18n="nav.saved">Saved</a>
        <a href="login.html" data-i18n="nav.login">Login</a>
      </nav>
      <div class="topbar-right">
        <div class="lang-switch" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="sq">SQ</button>
        </div>
        <a href="profile.html" id="userBadge" class="user-badge">Guest</a>
      </div>
    </header>

    <main class="page-wrap">
      <h1 data-i18n="saved.title">Saved designs</h1>
      <p class="page-subtitle" data-i18n="saved.sub">Your bookmarked studio designs.</p>
      <section id="savedPinsGrid" class="pins-grid shop-grid">
        <p class="empty-state" data-i18n="saved.empty">No saved designs yet.</p>
      </section>
    </main>

    <div id="pinDetailModal" class="modal hidden">
      <div class="modal-card detail-modal">
        <button id="closeDetailBtn" class="close-btn" type="button" aria-label="Close">×</button>
        <div id="pinDetailContent" class="detail-content"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
